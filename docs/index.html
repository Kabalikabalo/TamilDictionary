<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TamilDictionary Shard Editor</title>
<link rel="icon" type="image/png" href="file_000000005110620a83c21f1993021090.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
    --primary-color: #ff6b35;
    --secondary-color: #ff8c42;
    --accent-color: #ffa726;
    --glow-color: rgba(255, 107, 53, 0.3);
    --glow-color-light: rgba(255, 107, 53, 0.1);
    --particle-color: #ff6b35;
    --dark-bg: #0a0a0a;
    --card-bg: #1a1a1a;
    --text-primary: #fff;
    --text-secondary: #b0b0b0;
    --border-color: #333;
    --shadow-medium: 0 8px 30px var(--glow-color);
    --border-radius: 16px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
body {
    font-family: 'Inter', sans-serif;
    background: var(--dark-bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    margin: 0;
    padding: 0;
}
.bg-animation {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    background: radial-gradient(circle at 20% 50%, var(--glow-color-light) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, var(--glow-color-light) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, var(--glow-color-light) 0%, transparent 50%);
    animation: bgFloat 20s ease-in-out infinite;
}
@keyframes bgFloat {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    33% { transform: translateY(-4px) rotate(0.2deg); }
    66% { transform: translateY(2px) rotate(-0.2deg); }
}
.particle {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--particle-color);
    border-radius: 50%;
    opacity: 0.6;
    animation: float 8s ease-in-out infinite;
    pointer-events: none;
}
@keyframes float {
    0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    25% { transform: translateY(-100px) translateX(20px); opacity: 0.8; }
    50% { transform: translateY(-60px) translateX(-20px); opacity: 0.6; }
    75% { transform: translateY(-120px) translateX(10px); opacity: 0.4; }
}
.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 2rem;
    position: relative;
    z-index: 1;
}
.header {
    text-align: center;
    margin-bottom: 2rem;
    animation: fadeInUp 1s ease-out;
}
.logo {
    font-size: 2.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
    text-shadow: 0 0 30px var(--glow-color);
    font-family: 'Noto Sans Tamil', serif;
}
.subtitle {
    font-size: 1.1rem;
    color: var(--text-secondary);
    font-weight: 400;
    letter-spacing: 0.5px;
}
.card {
    background: #1a1a1a30;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: 2rem;
    margin-bottom: 2rem;
    box-shadow: var(--shadow-medium);
    animation: fadeInUp 1s ease-out 0.2s both;
    position: relative;
    overflow: hidden;
}
.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
    animation: slideIn 2s ease-out;
}
.input-group {
    margin-bottom: 1.5rem;
}
.input-group label {
    display: block;
    color: var(--accent-color);
    font-weight: 500;
    margin-bottom: 0.5rem;
    font-size: 0.95rem;
}
.input-field {
    width: 100%;
    padding: 1rem 1.5rem;
    background: var(--dark-bg);
    border: 2px solid var(--border-color);
    border-radius: 12px;
    font-size: 1.05rem;
    color: var(--text-primary);
    outline: none;
    transition: var(--transition);
    font-family: 'Inter', 'Noto Sans Tamil', sans-serif;
    box-sizing: border-box;
}
.input-field:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px var(--glow-color-light);
    transform: translateY(-2px);
}
.btn {
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    border: none;
    border-radius: 12px;
    padding: 1rem 2rem;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow-medium);
    font-size: 1rem;
    width: 100%;
    margin-top: 0.5rem;
}
.btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 12px 40px var(--glow-color);
}
.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.btn-group {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
}
.btn-group .btn {
    flex: 1;
}
.status-message {
    padding: 1rem;
    border-radius: 12px;
    margin-bottom: 1rem;
    font-size: 0.95rem;
    animation: fadeInUp 0.5s;
}
.status-info {
    background: rgba(100, 181, 246, 0.1);
    border: 1px solid #64b5f6;
    color: #90caf9;
}
.status-success {
    background: rgba(129, 199, 132, 0.1);
    border: 1px solid #81c784;
    color: #a5d6a7;
}
.status-error {
    background: rgba(229, 115, 115, 0.1);
    border: 1px solid #e57373;
    color: #ef5350;
}
.status-warning {
    background: var(--glow-color-light);
    border: 1px solid var(--accent-color);
    color: var(--accent-color);
}
.current-entry-display {
    background: var(--dark-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1.5rem;
    margin: 1rem 0;
    font-family: 'Noto Sans Tamil', 'Inter', sans-serif;
    line-height: 1.8;
}
.current-entry-display .key {
    color: var(--primary-color);
    font-weight: 600;
    font-size: 1.1rem;
}
.current-entry-display .translations {
    color: var(--text-secondary);
    margin-top: 0.5rem;
}
.current-entry-display .field-name {
    color: var(--accent-color);
    font-weight: 500;
    font-size: 0.9rem;
    margin-top: 0.8rem;
}
.step-indicator {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px);}
    to { opacity: 1; transform: translateY(0);}
}
@keyframes slideIn {
    from { transform: scaleX(0);}
    to { transform: scaleX(1);}
}
@media (max-width: 768px) {
    .container { padding: 1rem; }
    .logo { font-size: 2rem; }
    .card { padding: 1.5rem; }
    .btn-group { flex-direction: column; }
}
</style>
</head>
<body>
<div class="bg-animation"></div>
<div class="container">
    <header class="header">
        <h1 class="logo">🧩 அகராதி திருத்தி</h1>
        <p class="subtitle">TamilDictionary Shard Editor</p>
    </header>

    <!-- Setup Section -->
    <div id="setupSection" class="card">
        <div class="input-group">
            <label for="token"><i class="fas fa-key"></i> GitHub Personal Access Token</label>
            <input type="password" id="token" class="input-field" placeholder="Paste your PAT here">
        </div>
        <div class="input-group">
            <label for="repo"><i class="fas fa-code-branch"></i> Repository (owner/name)</label>
            <input type="text" id="repo" class="input-field" value="Kabalikabalo/TamilDictionary">
        </div>
        <button id="loadBtn" class="btn"><i class="fas fa-download"></i> Load Shards</button>
        <div id="setupStatus"></div>
    </div>

    <!-- Editor Section -->
    <div id="editorSection" class="card" style="display:none;">
        <div class="step-indicator" id="stepIndicator">Step 1: Enter a word</div>
        <div id="statusDisplay"></div>
        
        <!-- Step 1: Enter Key -->
        <div id="step1" style="display:none;">
            <div class="input-group">
                <label for="wordKey"><i class="fas fa-pen"></i> Key (Tamil or English word)</label>
                <input type="text" id="wordKey" class="input-field" placeholder="Enter a word...">
            </div>
            <button id="checkKeyBtn" class="btn"><i class="fas fa-search"></i> Check Word</button>
        </div>

        <!-- Step 2: Entry exists - choose action -->
        <div id="step2" style="display:none;">
            <div id="currentEntryDisplay" class="current-entry-display"></div>
            <p style="color:var(--text-secondary);margin-bottom:1rem;">This word already exists. What would you like to do?</p>
            <div class="btn-group">
                <button id="appendBtn" class="btn"><i class="fas fa-plus"></i> Append</button>
                <button id="rewriteBtn" class="btn"><i class="fas fa-sync"></i> Rewrite</button>
                <button id="skipBtn" class="btn"><i class="fas fa-times"></i> Skip</button>
            </div>
        </div>

        <!-- Step 3: Enter translations -->
        <div id="step3" style="display:none;">
            <div class="input-group">
                <label for="translations"><i class="fas fa-language"></i> Translations (comma-separated)</label>
                <textarea id="translations" class="input-field" rows="3" placeholder="Enter translations separated by commas..."></textarea>
            </div>
            <div class="btn-group">
                <button id="saveBtn" class="btn"><i class="fas fa-save"></i> Save</button>
                <button id="cancelBtn" class="btn"><i class="fas fa-ban"></i> Cancel</button>
            </div>
        </div>
    </div>
</div>

<script>
function btoaUTF8(str) { return btoa(unescape(encodeURIComponent(str))); }
function atobUTF8(str) { return decodeURIComponent(escape(atob(str))); }

let token, repo, manifest = {}, manifestSha = '', currentShard = '', currentShardData = {}, currentShardSha = '', currentKey = '', mode = '';
let repoDefaultBranch = 'main'; // Store the default branch

// Floating particles
function createParticles() {
    for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 8 + 's';
        particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
        document.body.appendChild(particle);
    }
}
document.addEventListener('DOMContentLoaded', createParticles);

function showStatus(msg, type = 'info') {
    const div = document.getElementById('statusDisplay');
    div.innerHTML = `<div class="status-message status-${type}">${msg}</div>`;
}

function bucketOf(key) {
    if (!key || typeof key !== 'string') return '_misc';
    const k = key.trim();
    if (!k) return '_misc';
    return k[0] || '_misc';
}

function dedupe(arr) {
    const s = new Set();
    return arr.filter(t => t && !s.has(t) && s.add(t));
}

// NEW: Atomic commit function using GitHub Tree API
async function commitMultipleFiles(files, commitMessage) {
    try {
        // 1. Get the current commit SHA
        const refRes = await fetch(`https://api.github.com/repos/${repo}/git/ref/heads/${repoDefaultBranch}`, {
            headers: { Authorization: `token ${token}` }
        });
        const refData = await refRes.json();
        const currentCommitSha = refData.object.sha;
        
        // 2. Get the current tree
        const commitRes = await fetch(`https://api.github.com/repos/${repo}/git/commits/${currentCommitSha}`, {
            headers: { Authorization: `token ${token}` }
        });
        const commitData = await commitRes.json();
        const baseTreeSha = commitData.tree.sha;
        
        // 3. Create blobs for each file
        const treeItems = [];
        for (const file of files) {
            const blobRes = await fetch(`https://api.github.com/repos/${repo}/git/blobs`, {
                method: 'POST',
                headers: { Authorization: `token ${token}` },
                body: JSON.stringify({
                    content: btoaUTF8(file.content),
                    encoding: 'base64'
                })
            });
            const blobData = await blobRes.json();
            
            treeItems.push({
                path: file.path,
                mode: '100644',
                type: 'blob',
                sha: blobData.sha
            });
        }
        
        // 4. Create a new tree
        const treeRes = await fetch(`https://api.github.com/repos/${repo}/git/trees`, {
            method: 'POST',
            headers: { Authorization: `token ${token}` },
            body: JSON.stringify({
                base_tree: baseTreeSha,
                tree: treeItems
            })
        });
        const treeData = await treeRes.json();
        
        // 5. Create a new commit
        const newCommitRes = await fetch(`https://api.github.com/repos/${repo}/git/commits`, {
            method: 'POST',
            headers: { Authorization: `token ${token}` },
            body: JSON.stringify({
                message: commitMessage,
                tree: treeData.sha,
                parents: [currentCommitSha]
            })
        });
        const newCommitData = await newCommitRes.json();
        
        // 6. Update the reference
        await fetch(`https://api.github.com/repos/${repo}/git/refs/heads/${repoDefaultBranch}`, {
            method: 'PATCH',
            headers: { Authorization: `token ${token}` },
            body: JSON.stringify({
                sha: newCommitData.sha
            })
        });
        
        return { success: true, commitSha: newCommitData.sha };
    } catch (e) {
        console.error('Atomic commit error:', e);
        return { success: false, error: e.message };
    }
}

// Load manifest
document.getElementById('loadBtn').addEventListener('click', async () => {
    token = document.getElementById('token').value.trim();
    repo = document.getElementById('repo').value.trim();
    if (!token || !repo) {
        document.getElementById('setupStatus').innerHTML = '<div class="status-message status-error">Please enter both token and repository.</div>';
        return;
    }
    document.getElementById('setupStatus').innerHTML = '<div class="status-message status-info"><i class="fas fa-spinner fa-spin"></i> Loading manifest...</div>';
    
    try {
        // Get repository info to determine default branch
        const repoRes = await fetch(`https://api.github.com/repos/${repo}`, {
            headers: { Authorization: `token ${token}` }
        });
        const repoData = await repoRes.json();
        repoDefaultBranch = repoData.default_branch || 'main';
        
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/shards/manifest.json`, {
            headers: { Authorization: `token ${token}` }
        });
        const data = await res.json();
        if (data.content) {
            manifest = JSON.parse(atobUTF8(data.content));
            manifestSha = data.sha;
            document.getElementById('setupStatus').innerHTML = '<div class="status-message status-success"><i class="fas fa-check"></i> Manifest loaded! Ready to edit.</div>';
            document.getElementById('setupSection').style.display = 'none';
            document.getElementById('editorSection').style.display = 'block';
            showStep1();
        } else {
            throw new Error('Failed to load manifest');
        }
    } catch (e) {
        document.getElementById('setupStatus').innerHTML = '<div class="status-message status-error"><i class="fas fa-exclamation-triangle"></i> Error loading manifest. Check your token and repo.</div>';
    }
});

function showStep1() {
    document.getElementById('step1').style.display = 'block';
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step3').style.display = 'none';
    document.getElementById('stepIndicator').innerText = 'Step 1: Enter a word';
    document.getElementById('wordKey').value = '';
    document.getElementById('wordKey').focus();
}

// Check if key exists
document.getElementById('checkKeyBtn').addEventListener('click', async () => {
    currentKey = document.getElementById('wordKey').value.trim();
    if (!currentKey) {
        showStatus('Please enter a word.', 'error');
        return;
    }
    
    const bucket = bucketOf(currentKey);
    currentShard = bucket;
    showStatus(`<i class="fas fa-spinner fa-spin"></i> Checking shard ${bucket}.json...`, 'info');
    
    try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/shards/${bucket}.json`, {
            headers: { Authorization: `token ${token}` }
        });
        const data = await res.json();
        
        // Load shard content (handle large files)
        if (data.content && data.encoding === 'base64') {
            currentShardData = JSON.parse(atobUTF8(data.content));
            currentShardSha = data.sha;
        } else if (data.sha) {
            // Use blob API for large files
            const blobRes = await fetch(`https://api.github.com/repos/${repo}/git/blobs/${data.sha}`, {
                headers: { Authorization: `token ${token}` }
            });
            const blob = await blobRes.json();
            currentShardData = JSON.parse(atobUTF8(blob.content));
            currentShardSha = data.sha;
        } else {
            throw new Error('Failed to load shard');
        }
        
        // Check if key exists
        if (currentShardData[currentKey]) {
            showStep2();
        } else {
            showStep3New();
        }
    } catch (e) {
        showStatus(`<i class="fas fa-exclamation-triangle"></i> Error loading shard: ${e.message}`, 'error');
    }
});

function showStep2() {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    document.getElementById('step3').style.display = 'none';
    document.getElementById('stepIndicator').innerText = 'Step 2: Entry exists - choose action';
    
    const entry = currentShardData[currentKey];
    let displayHTML = `<div class="key">${currentKey}</div>`;
    
    // Display all fields in the entry
    for (const [fieldName, translations] of Object.entries(entry)) {
        if (Array.isArray(translations)) {
            displayHTML += `<div class="field-name">${fieldName}:</div>`;
            displayHTML += `<div class="translations">${translations.join(', ')}</div>`;
        }
    }
    
    document.getElementById('currentEntryDisplay').innerHTML = displayHTML;
    showStatus('', 'info');
}

document.getElementById('appendBtn').addEventListener('click', () => {
    mode = 'append';
    showStep3();
});

document.getElementById('rewriteBtn').addEventListener('click', () => {
    mode = 'rewrite';
    showStep3();
});

document.getElementById('skipBtn').addEventListener('click', () => {
    showStatus('<i class="fas fa-info-circle"></i> Skipped.', 'warning');
    setTimeout(showStep1, 1500);
});

function showStep3New() {
    mode = 'new';
    showStep3();
    showStatus('<i class="fas fa-plus-circle"></i> No entry found. Creating new entry.', 'info');
}

function showStep3() {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step3').style.display = 'block';
    document.getElementById('stepIndicator').innerText = 'Step 3: Enter translations';
    document.getElementById('translations').value = '';
    document.getElementById('translations').focus();
}

document.getElementById('cancelBtn').addEventListener('click', () => {
    showStatus('<i class="fas fa-ban"></i> Cancelled.', 'warning');
    setTimeout(showStep1, 1500);
});

// UPDATED: Save with atomic commit
document.getElementById('saveBtn').addEventListener('click', async () => {
    const translationsInput = document.getElementById('translations').value;
    const translations = translationsInput.split(',').map(s => s.trim()).filter(Boolean);
    
    if (!translations.length) {
        showStatus('Please enter at least one translation.', 'error');
        return;
    }
    
    showStatus('<i class="fas fa-spinner fa-spin"></i> Saving (atomic commit)...', 'info');
    
    // Update shard data based on mode
    if (mode === 'new' || mode === 'rewrite') {
        currentShardData[currentKey] = { default: dedupe(translations) };
    } else if (mode === 'append') {
        let entry = currentShardData[currentKey];
        if (!entry || typeof entry !== 'object') {
            entry = { default: [] };
        }
        
        let targetField = 'default';
        if (Array.isArray(entry.default)) {
            targetField = 'default';
        } else {
            for (const [k, v] of Object.entries(entry)) {
                if (Array.isArray(v)) {
                    targetField = k;
                    break;
                }
            }
        }
        
        if (!entry[targetField] || !Array.isArray(entry[targetField])) {
            entry[targetField] = [];
        }
        
        const current = entry[targetField];
        if (current.length > 0 && Array.isArray(current[0])) {
            current[0] = dedupe([...current[0], ...translations]);
        } else {
            entry[targetField] = dedupe([...current, ...translations]);
        }
        
        currentShardData[currentKey] = entry;
    }
    
    // Update manifest
    manifest[currentShard] = manifest[currentShard] || {};
    manifest[currentShard].keys = Object.keys(currentShardData).length;
    manifest[currentShard].file = `${currentShard}.json`;
    
    try {
        // Commit both files atomically
        const result = await commitMultipleFiles([
            {
                path: `shards/${currentShard}.json`,
                content: JSON.stringify(currentShardData, null, 2)
            },
            {
                path: 'shards/manifest.json',
                content: JSON.stringify(manifest, null, 2)
            }
        ], `${mode === 'new' ? 'Add' : mode === 'append' ? 'Append' : 'Rewrite'} '${currentKey}' in ${currentShard}.json`);
        
        if (result.success) {
            showStatus(`<i class="fas fa-check-circle"></i> ✅ ${mode === 'new' ? 'Added' : mode === 'append' ? 'Appended' : 'Rewrote'} '${currentKey}' in shard '${currentShard}.json' (single commit).`, 'success');
            
            // Refresh SHAs for next operation
            await refreshFileShas();
            
            setTimeout(showStep1, 2000);
        } else {
            throw new Error(result.error || 'Atomic commit failed');
        }
    } catch (e) {
        showStatus(`<i class="fas fa-exclamation-triangle"></i> Error saving: ${e.message}`, 'error');
    }
});

// Helper to refresh file SHAs after commit
async function refreshFileShas() {
    try {
        const manifestRes = await fetch(`https://api.github.com/repos/${repo}/contents/shards/manifest.json`, {
            headers: { Authorization: `token ${token}` }
        });
        const manifestData = await manifestRes.json();
        manifestSha = manifestData.sha;
        
        const shardRes = await fetch(`https://api.github.com/repos/${repo}/contents/shards/${currentShard}.json`, {
            headers: { Authorization: `token ${token}` }
        });
        const shardData = await shardRes.json();
        currentShardSha = shardData.sha;
    } catch (e) {
        console.warn('Failed to refresh SHAs:', e);
    }
}

// Allow Enter key to submit in input fields
document.getElementById('wordKey').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('checkKeyBtn').click();
});
</script>
</body>
</html>
