<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TamilDictionary Shard Web Editor (Simple)</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    input, textarea { width: 100%; margin-bottom: 1em; }
    button { margin-right: 1em; }
    .shard-select { width: 200px; }
    .entry-list { max-height: 200px; overflow: auto; }
    .entry-list div { padding: 2px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h2>🧩 TamilDictionary Shard Web Editor (No React)</h2>
  <label>
    GitHub PAT (repo scope):<br>
    <input id="token" type="password">
  </label>
  <br>
  <label>
    Repo (owner/name):<br>
    <input id="repo" value="Kabalikabalo/TamilDictionary">
  </label>
  <br>
  <div>
    <b>Select Shard:</b>
    <select id="shardSelect" class="shard-select">
      <option value="">-- Select --</option>
    </select>
  </div>
  <div id="loading" style="color:blue"></div>
  <div id="entries"></div>
  <div id="editBox" style="display:none;margin-top:2em;">
    <h4>Add / Edit Entry</h4>
    <input id="editKey" placeholder="Word (key)">
    <textarea id="editValue" placeholder="Comma separated translations" rows="2"></textarea>
    <button id="saveBtn">Save Entry</button>
  </div>
  <div id="status" style="color:green;margin-top:1em"></div>
  <script>
    function btoaUTF8(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }
    function atobUTF8(str) {
      return decodeURIComponent(escape(atob(str)));
    }
    let manifest = {};
    let manifestSha = '';
    let shardSha = '';
    let shardData = {};
    let selectedShard = '';

    function showStatus(msg, color='green') {
      document.getElementById('status').innerText = msg;
      document.getElementById('status').style.color = color;
    }

    function showLoading(msg) {
      document.getElementById('loading').innerText = msg;
    }

    function loadManifest() {
      showLoading('Loading manifest...');
      let token = document.getElementById('token').value.trim();
      let repo = document.getElementById('repo').value.trim();
      fetch(`https://api.github.com/repos/${repo}/contents/shards/manifest.json`, {
        headers: { Authorization: `token ${token}` }
      })
      .then(r => r.json())
      .then(data => {
        if(data.content) {
          manifest = JSON.parse(atobUTF8(data.content));
          manifestSha = data.sha;
          let select = document.getElementById('shardSelect');
          select.innerHTML = '<option value="">-- Select --</option>';
          Object.keys(manifest).forEach(bucket => {
            let opt = document.createElement('option');
            opt.value = bucket;
            opt.textContent = bucket + ".json";
            select.appendChild(opt);
          });
          showStatus('Manifest loaded!', 'green');
        } else {
          showStatus('Failed to load manifest', 'red');
        }
        showLoading('');
      })
      .catch(e => { showStatus('Error loading manifest', 'red'); showLoading(''); });
    }

    function loadShard() {
      let token = document.getElementById('token').value.trim();
      let repo = document.getElementById('repo').value.trim();
      selectedShard = document.getElementById('shardSelect').value;
      if (!selectedShard) {
        document.getElementById('entries').innerHTML = '';
        document.getElementById('editBox').style.display = 'none';
        return;
      }
      showLoading('Loading shard...');
      fetch(`https://api.github.com/repos/${repo}/contents/shards/${selectedShard}.json`, {
        headers: { Authorization: `token ${token}` }
      })
      .then(r => r.json())
      .then(data => {
        if(data.content) {
          shardData = JSON.parse(atobUTF8(data.content));
          shardSha = data.sha;
          renderEntries();
        } else {
          showStatus('Failed to load shard', 'red');
        }
        showLoading('');
      })
      .catch(e => { showStatus('Error loading shard', 'red'); showLoading(''); });
    }

    function renderEntries() {
      let div = document.getElementById('entries');
      div.innerHTML = `<h3>Entries in ${selectedShard}.json</h3><div class="entry-list"></div>`;
      let listDiv = div.querySelector('.entry-list');
      Object.entries(shardData).forEach(([k, v]) => {
        let row = document.createElement('div');
        row.innerHTML = `<b>${k}:</b> ${(v.default || []).join(', ')} <button data-key="${k}">Edit</button>`;
        row.querySelector('button').onclick = function() {
          document.getElementById('editKey').value = k;
          document.getElementById('editValue').value = (v.default || []).join(', ');
          document.getElementById('editBox').style.display = '';
        }
        listDiv.appendChild(row);
      });
      document.getElementById('editBox').style.display = '';
      document.getElementById('editKey').value = '';
      document.getElementById('editValue').value = '';
    }

    function saveEntry() {
      let key = document.getElementById('editKey').value.trim();
      let value = document.getElementById('editValue').value.split(',').map(s=>s.trim()).filter(Boolean);
      if (!key) return;
      shardData[key] = { default: value };
      saveShard();
    }

    function saveShard() {
      showLoading('Saving...');
      let token = document.getElementById('token').value.trim();
      let repo = document.getElementById('repo').value.trim();
      fetch(`https://api.github.com/repos/${repo}/contents/shards/${selectedShard}.json`, {
        method: 'PUT',
        headers: { Authorization: `token ${token}` },
        body: JSON.stringify({
          message: `Update shard ${selectedShard}`,
          content: btoaUTF8(JSON.stringify(shardData, null, 2)),
          sha: shardSha
        })
      })
      .then(r => r.json())
      .then(data => {
        if (data.content && data.content.sha) {
          shardSha = data.content.sha;
          // Update manifest key count
          manifest[selectedShard].keys = Object.keys(shardData).length;
          return fetch(`https://api.github.com/repos/${repo}/contents/shards/manifest.json`, {
            method: 'PUT',
            headers: { Authorization: `token ${token}` },
            body: JSON.stringify({
              message: `Update manifest for ${selectedShard}`,
              content: btoaUTF8(JSON.stringify(manifest, null, 2)),
              sha: manifestSha
            })
          });
        }
        throw new Error('Save failed');
      })
      .then(r => r.json())
      .then(data => {
        if (data.content && data.content.sha) {
          manifestSha = data.content.sha;
          showStatus('Saved!', 'green');
          renderEntries();
        } else {
          throw new Error('Manifest update failed');
        }
        showLoading('');
      })
      .catch(e => { showStatus('Error saving', 'red'); showLoading(''); });
    }

    document.getElementById('token').addEventListener('change', loadManifest);
    document.getElementById('repo').addEventListener('change', loadManifest);
    document.getElementById('shardSelect').addEventListener('change', loadShard);
    document.getElementById('saveBtn').addEventListener('click', saveEntry);

    // Optional: auto-load if token is filled in
    // window.onload = function() { if(document.getElementById('token').value) loadManifest(); }
  </script>
  <p>
    <small>
      <b>How to use:</b> Create a GitHub Personal Access Token (with <code>repo</code> scope), enter it above, select a shard, edit, and save.<br>
      <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">Create a PAT here</a>.
    </small>
  </p>
</body>
</html>
